services:
  server:
    image: thevulnx/ccim-server:latest
    container_name: ccim-server
    # No ports exposed to the host. It talks to Nginx internally on port 8080
    volumes:
      - ./ccim-data:/app/data # Persistent storage for SQLite and uploaded files
    restart: unless-stopped

  webui:
    image: thevulnx/ccim-webui:latest
    container_name: ccim-webui
    ports:
      - "8001:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped
    depends_on:
      - server
